# Homelab gateway — /etc/nginx/sites-available/gateway.conf
upstream uMyapi        { server 127.0.0.1:8080;  keepalive 16; }
upstream uMycomputer   { server 127.0.0.1:28080; keepalive 16; }
upstream uOsh          { server 127.0.0.1:9080;  keepalive 16; }
upstream uSimplestock  { server 127.0.0.1:50000; keepalive 16; }
upstream uAim          { server 127.0.0.1:26060; keepalive 16; }
upstream uLlm          { server 127.0.0.1:8780;  keepalive 8; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # Welcome hub — single self-contained index.html
  location = / {
    root /var/www/gateway;
    try_files /index.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /myapi/ {
    proxy_pass http://uMyapi;
  }

  location ^~ /my-computer/api/ {
    proxy_pass http://uMycomputer;
    proxy_buffering off; proxy_cache off; gzip off;
  }
  location ^~ /my-computer/mcp/ {
    proxy_pass http://uMycomputer;
    proxy_buffering off; proxy_cache off; gzip off;
  }
  location /my-computer/ {
    proxy_pass http://uMycomputer;
    proxy_buffering off; proxy_cache off; gzip off;
  }

  location /osh/ {
    proxy_pass http://uOsh;
  }

  location /simpleStock/ {
    proxy_pass http://uSimplestock/;
    proxy_buffering off; proxy_cache off; gzip off;
  }

  location /aim/ {
    proxy_pass http://uAim/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Forwarded-Prefix /aim;
    proxy_buffering off; proxy_cache off; gzip off;
  }

  location /llm/ {
    proxy_pass http://uLlm/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /llm;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }
}
